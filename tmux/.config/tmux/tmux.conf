# configure true colors
set -g default-terminal "tmux-256color"
# https://stackoverflow.com/questions/41783367/tmux-tmux-true-color-is-not-working-properly
set -sa terminal-overrides ",xterm*:Tc"
# toggle maximize pane
# bind -r m resize-pane -Z
# refresh config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# vertically maximize
bind -n M-z if -F '#{@layout_save}' \
    {run 'tmux select-layout "#{@layout_save}" ; set -up @layout_save'} \
    {set -Fp @layout_save "#{window_layout}" ; run 'tmux resize-pane -y 100%'}

# set focus-eve -- handled by tmux sensible https://github.com/tmux-plugins/tmux-sensible
# set -g focus-events on
# set -sg escape-time 10

set -g mouse on
set -s set-clipboard on
set -s copy-command 'printf "\033]52;c;%s\007" $(base64 -w0 | head -c -1)'

# status bar
# set -g status-style "bg=#0000,fg=white"
set -g status-bg default
set -g status-fg default
set -g status-right-length 65
set -g status-left ""

# Fix for 3.7 tmux command prompt on top of status bar


# https://github.com/catppuccin/tmux
# set -g @plugin 'catppuccin/tmux' # for TPM use
set -g @catppuccin_flavor 'mocha' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_status "yes"
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W 󰖯"
# set -g @catppuccin_window_text_color "#{@thm_surface_0}"
# set -g @catppuccin_window_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_mantle}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
# set -g @catppuccin_application_text " #{pane_current_command}"
# set -g @catppuccin_session_text " #{session_name}"
 
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "off" # See `pane-border-status`
set -g @catppuccin_pane_left_separator "█"
set -g @catppuccin_pane_right_separator "█"
set -g @catppuccin_pane_middle_separator "█"
set -g @catppuccin_pane_number_position "left"
set -g @catppuccin_pane_default_fill "number"
set -g @catppuccin_pane_default_text "#{b:pane_current_path}"
set -g @catppuccin_pane_border_style "fg=#{@thm_mauve}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_peach}"
set -g @catppuccin_pane_color "#{@thm_peach}"
set -g @catppuccin_pane_background_color "#{@thm_peach}"
#

set-option -g status-position top


# plugins for TPM
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'



#last line
run '~/.config/tmux/plugins/tmux-sensible/sensible.tmux'
run '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'
# run '~/.config/tmux/plugins/tpm/tpm'

#custom time ~/.config/tmux/catppuccinCustoms/time.conf
source ~/.config/tmux/catppuccinCustoms/time.conf 

set -gF message-style "fg=#{@thm_teal},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"

set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_host}"
# set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_time}"
# run '~/.config/tmux/plugins/tmux-battery/battery.tmux'

# set -g @catppuccin_status_modules_left ""

# Override tmux-sensible's escape-time
set -s escape-time 1

# nested tmux nvim:
# is_vim="~/.config/tmux/is_nvim.sh"

# bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+
